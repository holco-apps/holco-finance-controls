[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holco-finance-controls"
version = "0.5.0"
description = "Reproducible, evidence-bound controls for financial AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HOLCO" }]
keywords = ["ai", "controls", "finance", "agents", "governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
holco-controls-conformance = "holco_finance_controls.conformance:main"
holco-controls-demo = "holco_finance_controls.demo:main"
holco-finance-controls = "holco_finance_controls.cli:main"
holco-controls-mcp = "holco_finance_controls.server:main"

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
holco_finance_controls = ["conformance_data/*.json"]
