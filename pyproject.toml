[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holco-finance-evals"
version = "0.1.0"
description = "Reproducible, source-aware evaluations for financial AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HOLCO" }]
keywords = ["ai", "evals", "finance", "agents", "governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
holco-finance-evals = "holco_finance_evals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
